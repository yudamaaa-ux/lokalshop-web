<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja - LOKAL SHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen pb-20">

    <!-- NAVIGASI UTAMA -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 text-gray-500 hover:text-green-600 transition font-bold text-sm">
                <span>← Kembali ke Beranda</span>
            </a>
            <h1 class="text-lg font-black text-gray-800 flex items-center gap-2"><span>🛒</span> Keranjang Anda</h1>
            <div class="w-20"></div> <!-- Spacer -->
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8 animate-fade-in">

        <!-- STATE JIKA KERANJANG KOSONG -->
        <div id="keranjangKosong" class="hidden text-center py-20 bg-white rounded-3xl border border-gray-100 shadow-sm">
            <span class="text-6xl block mb-4">🛍️</span>
            <h2 class="text-xl font-black text-gray-800 mb-2">Keranjang Anda Masih Kosong</h2>
            <p class="text-gray-500 text-sm mb-6">Yuk, cari produk lokal menarik dan masukkan ke keranjang!</p>
            <a href="index.html" class="bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-3 rounded-xl shadow-md transition">Mulai Belanja Sekarang</a>
        </div>

        <!-- WADAH DAFTAR KERANJANG -->
        <div id="wadahKeranjang" class="space-y-6">
            <div class="text-center py-10 text-gray-400 font-bold text-sm animate-pulse">Memuat isi keranjang...</div>
        </div>
    </main>

    <script>
        // --- KONFIGURASI SUPABASE ---
        const { createClient } = supabase;
        const supabaseUrl = 'https://snclpxrtxjwefzrmkylo.supabase.co'; 
        const supabaseKey = 'sb_publishable_Sw_2GbforFsxCsf8zIwDJw_a3XuRnjl';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

        let emailPembeli = null;
        let namaPembeliDefault = "";
        let alamatPembeliDefault = "";

        // 1. CEK LOGIN (UNTUK MENGAMBIL DATA DEFAULT PEMBELI)
        async function ambilDataPembeli() {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (user) {
                    emailPembeli = user.email;
                    const meta = user.user_metadata || {};
                    namaPembeliDefault = meta.full_name || user.email.split('@')[0];
                    alamatPembeliDefault = meta.address || "";
                }
            } catch (err) { console.error(err); }
            
            // Lanjut muat keranjang setelah cek login selesai
            muatKeranjang();
        }

        // 2. RENDER KERANJANG KE LAYAR
        function muatKeranjang() {
            // Ambil dari Local Storage browser
            let cart = JSON.parse(localStorage.getItem('lokalshop_cart')) || [];
            const wadah = document.getElementById('wadahKeranjang');
            const kosong = document.getElementById('keranjangKosong');

            // Jika kosong
            if (cart.length === 0) {
                wadah.innerHTML = '';
                kosong.classList.remove('hidden');
                return;
            }

            kosong.classList.add('hidden');

            // Kelompokkan produk berdasarkan ID Toko (Seperti Shopee/Tokopedia)
            const groupedCart = cart.reduce((acc, item) => {
                const idToko = item.id_toko || 'toko_lain';
                if (!acc[idToko]) {
                    acc[idToko] = { 
                        nama_toko: item.nama_toko || 'Toko Lokal Shop', 
                        no_wa: item.no_wa || '', 
                        items: [] 
                    };
                }
                acc[idToko].items.push(item);
                return acc;
            }, {});

            // Render HTML per Toko
            let html = '';
            for (const tokoId in groupedCart) {
                const toko = groupedCart[tokoId];
                let subtotalToko = 0;
                
                let htmlItems = toko.items.map((item, index) => {
                    const totalItem = item.harga * item.qty;
                    subtotalToko += totalItem;
                    const fotoItem = item.foto || 'https://via.placeholder.com/150';

                    return `
                        <div class="flex items-center gap-4 py-4 border-b border-gray-100 last:border-0 hover:bg-gray-50/50 p-2 rounded-xl transition">
                            <img src="${fotoItem}" class="w-16 h-16 object-cover rounded-lg border border-gray-200 shadow-sm">
                            <div class="flex-1">
                                <h4 class="font-bold text-sm text-gray-800 line-clamp-1">${item.nama_produk}</h4>
                                <p class="text-green-600 font-black text-sm">${formatRp(item.harga)}</p>
                                <p class="text-[9px] text-gray-400 mt-1 bg-gray-100 inline-block px-1.5 py-0.5 rounded">🚚 ${item.opsi_kirim || '-'} | 💳 ${item.opsi_bayar || '-'}</p>
                            </div>
                            <div class="flex flex-col items-end gap-2">
                                <span class="font-black text-sm text-gray-800 bg-gray-100 px-3 py-1 rounded-lg">x${item.qty}</span>
                                <button onclick="hapusItem('${item.id_produk}', '${tokoId}')" class="text-[10px] font-bold text-red-500 hover:text-white hover:bg-red-500 px-2 py-1 rounded transition">Hapus</button>
                            </div>
                        </div>
                    `;
                }).join('');

                html += `
                    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-5 md:p-6 mb-6">
                        <div class="flex items-center gap-2 mb-4 border-b border-gray-100 pb-3">
                            <span class="text-xl">🏪</span>
                            <h3 class="font-black text-gray-800 text-lg">${toko.nama_toko}</h3>
                        </div>
                        
                        ${htmlItems}
                        
                        <div class="mt-4 pt-4 border-t border-gray-100 flex justify-between items-center">
                            <span class="text-sm font-bold text-gray-500">Subtotal Toko:</span>
                            <span class="text-xl font-black text-green-600">${formatRp(subtotalToko)}</span>
                        </div>

                        <!-- Form Checkout Khusus Toko Ini -->
                        <div class="mt-6 bg-gray-50 p-5 rounded-2xl border border-gray-200">
                            <h4 class="text-xs font-black text-gray-800 mb-3 border-b border-gray-200 pb-2">Informasi Pengiriman & Checkout</h4>
                            <div class="space-y-3">
                                <div>
                                    <label class="text-[10px] font-bold text-gray-500 ml-1">Nama Penerima</label>
                                    <input type="text" id="nama_${tokoId}" value="${namaPembeliDefault}" placeholder="Nama Anda" class="w-full text-sm p-2.5 rounded-xl border border-gray-300 outline-none focus:border-green-500 bg-white shadow-sm">
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-gray-500 ml-1">Alamat Lengkap</label>
                                    <textarea id="alamat_${tokoId}" placeholder="RT/RW, Desa, Kecamatan, Patokan..." rows="2" class="w-full text-sm p-2.5 rounded-xl border border-gray-300 outline-none focus:border-green-500 bg-white shadow-sm">${alamatPembeliDefault}</textarea>
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-gray-500 ml-1">Catatan (Opsional)</label>
                                    <input type="text" id="catatan_${tokoId}" placeholder="Warna, ukuran, atau pesan ke penjual" class="w-full text-sm p-2.5 rounded-xl border border-gray-300 outline-none focus:border-green-500 bg-white shadow-sm">
                                </div>
                                
                                <button onclick="checkoutToko('${tokoId}')" id="btn_${tokoId}" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-4 rounded-xl shadow-md transition transform hover:-translate-y-0.5 mt-2 flex justify-center items-center gap-2">
                                    <span>✅</span> Buat Pesanan ke Toko Ini
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            wadah.innerHTML = html;
        }

        // 3. FUNGSI HAPUS ITEM DARI KERANJANG
        function hapusItem(idProduk, idToko) {
            let cart = JSON.parse(localStorage.getItem('lokalshop_cart')) || [];
            // Buang item yang diklik
            cart = cart.filter(item => !(item.id_produk === idProduk && item.id_toko === idToko));
            localStorage.setItem('lokalshop_cart', JSON.stringify(cart));
            
            // Refresh tampilan
            muatKeranjang();
        }

        // --- FUNGSI BARU YANG DITAMBAHKAN ---
        function buatPesanWhatsApp(data) {
            const formatRupiah = (angka) => 
                new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

            // Susun Template Pesan (Mendukung Multi-Produk dalam Keranjang)
            const pesan = `Halo Admin *${data.namaToko || 'Toko'}*, saya memesan produk dari Lokal Shop:

${data.detailProduk}
=====================
💵 *SUBTOTAL: ${formatRupiah(data.totalHarga)}*
=====================

👤 *Nama:* ${data.namaPembeli}
📍 *Alamat:* ${data.alamatPembeli}
📝 *Catatan:* ${data.catatan || '-'}

Mohon konfirmasinya ya!

🔔 *Catatan Admin:* 
Tolong konfirmasi & update status pesanan ini lewat menu *Pesanan Masuk* di Dashboard Lokal Shop agar pesanan tercatat diproses sehingga bisa membantu pembukuan toko setiap bulannya. Terima kasih!`;

            // Encode URL agar aman dikirim ke link wa.me
            const nomorWaAman = String(data.noWhatsapp).replace(/[^0-9]/g, '');
            const urlWa = `https://wa.me/${nomorWaAman}?text=${encodeURIComponent(pesan)}`;
            
            return urlWa;
        }
        // ------------------------------------

        // 4. PROSES CHECKOUT PER TOKO (MULTIPLE INSERT)
        async function checkoutToko(tokoId) {
            const nama = document.getElementById(`nama_${tokoId}`).value;
            const alamat = document.getElementById(`alamat_${tokoId}`).value;
            const catatan = document.getElementById(`catatan_${tokoId}`).value;

            if (!nama || !alamat) {
                alert("❌ Harap isi Nama dan Alamat Pengiriman!");
                return;
            }

            const btn = document.getElementById(`btn_${tokoId}`);
            btn.innerText = "Memproses Pesanan...";
            btn.disabled = true;

            let cart = JSON.parse(localStorage.getItem('lokalshop_cart')) || [];
            // Saring hanya item milik toko yang sedang dicheckout
            const itemsTokoIni = cart.filter(item => item.id_toko === tokoId);
            
            try {
                let totalSemua = 0;
                let textProdukWa = '';
                let arrayPesananDB = [];

                itemsTokoIni.forEach(item => {
                    const totalHargaItem = item.harga * item.qty;
                    totalSemua += totalHargaItem;
                    
                    // Siapkan text WhatsApp untuk keranjang multi-produk
                    textProdukWa += `📦 *${item.nama_produk}* (x${item.qty})\n`;
                    textProdukWa += `   Harga: ${formatRp(item.harga)}\n`;
                    textProdukWa += `   Kirim: ${item.opsi_kirim || 'Diambil Ke Tempat (Pickup)'}\n`;
                    textProdukWa += `   Bayar: ${item.opsi_bayar || 'COD / Tunai'}\n\n`;

                    // Siapkan data untuk disuntik ke Supabase (Tabel pesanan)
                    arrayPesananDB.push({
                        toko_id: item.id_toko,
                        produk_id: item.id_produk,
                        nama_pembeli: nama,
                        alamat: alamat,
                        qty: item.qty,
                        total_harga: totalHargaItem,
                        status: 'Menunggu Konfirmasi',
                        email_pembeli: emailPembeli, // Data login
                        catatan: `Kirim: ${item.opsi_kirim || '-'} | Bayar: ${item.opsi_bayar || '-'} | Note Pembeli: ${catatan}`
                    });
                });

                // Simpan pesanan ke Database Supabase
                const { error } = await supabaseClient.from('pesanan').insert(arrayPesananDB);
                if (error) throw error;

                // --- INTEGRASI FUNGSI BARU DI SINI ---
                const dataWa = {
                    namaToko: itemsTokoIni[0].nama_toko,
                    detailProduk: textProdukWa.trim(),
                    totalHarga: totalSemua,
                    namaPembeli: nama,
                    alamatPembeli: alamat,
                    catatan: catatan,
                    noWhatsapp: itemsTokoIni[0].no_wa
                };

                const urlWa = buatPesanWhatsApp(dataWa);
                // -------------------------------------

                // Hapus HANYA item dari toko ini di keranjang lokal
                cart = cart.filter(item => item.id_toko !== tokoId);
                localStorage.setItem('lokalshop_cart', JSON.stringify(cart));

                // Arahkan ke WhatsApp
                window.location.href = urlWa;

            } catch (err) {
                console.error(err);
                alert("Gagal memproses pesanan. Silakan periksa koneksi internet Anda.");
                btn.innerHTML = "<span>✅</span> Buat Pesanan ke Toko Ini";
                btn.disabled = false;
            }
        }

        // JALANKAN PROGRAM
        ambilDataPembeli();
    </script>
</body>
</html>
